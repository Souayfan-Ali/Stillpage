# CI (P0-05, tooling notes §6). `npm run verify` is the local gate.
# Rules: actions pinned by commit SHA; read-only token; no secrets in any job here.
# Inputs are pinned and hash-checked (npm lockfile, vendor.lock.json, lists.lock.json, lists/snapshots, the uBOL
# oracle); no test here depends on live web content.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (tracked files only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # This job downloads and generates nothing, so ESLint sees only tracked files: no upstream code
      # (vendor/resources) and no generated data (public/). Keep it that way; add no fetch or build step here.
      - run: npm run prepare:types
      - run: npm run lint

  compiler:
    name: Filter-list compiler (lists:build, verify, Chromium gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache downloaded lists and Chromium regex answers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/lists
            .cache/regex
          key: lists-${{ hashFiles('lists/lists.lock.json') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: lists-${{ hashFiles('lists/lists.lock.json') }}-
      - run: npm ci --ignore-scripts
      - run: npm run vendor:fetch
      - run: npx playwright install --with-deps chromium
      # Exactly the locked bytes: git-pinned lists are downloaded and hash-checked, unversioned lists come from
      # lists/snapshots. Packs whose licence is not cleared are left out, as in the store build.
      - run: npm run lists:fetch -- --drop-pending
      - run: npm run lists:build -- --check-determinism --drop-pending
      - name: Lock, snapshots, ledgers and counts must be unchanged by a rebuild of the same lock
        run: test -z "$(git status --porcelain -- lists)"
      # wxt.config.ts reads the ruleset list from the fragment; without it the build declares no rulesets.
      - name: Pack the generated data and the manifest fragment for the other jobs
        run: tar -cf "$RUNNER_TEMP/generated-public.tar" public dist/compiler/manifest.dnr.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-public
          path: ${{ runner.temp }}/generated-public.tar
          if-no-files-found: error
          retention-days: 1
      # The pinned uBO Lite release is the oracle of the differential suite; never an input to our build.
      - run: npm run oracle:fetch
      - run: npm run test:dnr
      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-output
          path: |
            public/rulesets
            public/*.json
            dist/compiler
          retention-days: 14

  verify:
    name: typecheck, knip, unit, build, size
    needs: compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run vendor:fetch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-public
          path: ${{ runner.temp }}
      - name: Unpack the generated data (typecheck, size and the build need it)
        run: tar -xf "$RUNNER_TEMP/generated-public.tar"
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: Upload extension build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-mv3
          path: .output/chrome-mv3
          retention-days: 7
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e-smoke:
    name: Playwright (bundled Chromium, local fixtures)
    needs: compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run vendor:fetch
      - run: npx playwright install --with-deps chromium
      - name: Fonts that tests/e2e/panelFit.spec.ts pins (D-139)
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-public
          path: ${{ runner.temp }}
      - name: Unpack the generated data
        run: tar -xf "$RUNNER_TEMP/generated-public.tar"
      - run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash scripts/install-tools.sh
      - run: .cache/tools/bin/gitleaks git --redact --no-banner --config .gitleaks.toml .
