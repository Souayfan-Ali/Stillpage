<!doctype html>
<!-- fixture: popups/p5-synthetic-anchor · a script-made anchor with target=_blank is clicked from script -->
<html lang="en"><head><meta charset="utf-8"><title>popups/p5-synthetic-anchor</title>
<style>body{margin:0;font:16px system-ui}p{margin:20px}button,a{display:inline-block;margin:20px;padding:10px}</style></head>
<body>
<p id="text">Plain article text, not a control.</p>
<script>
document.addEventListener('click', () => { const a = document.createElement('a'); a.href = 'https://popunder.example/ad'; a.target = '_blank'; document.body.append(a); a.click(); a.remove(); }, { once: true });
</script>
</body></html>
