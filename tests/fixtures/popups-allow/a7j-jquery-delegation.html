<!doctype html>
<!-- fixture: popups-allow/a7j-jquery-delegation · a jQuery-style handler delegated to the document -->

<style>body{margin:0;font:16px system-ui}p{margin:20px}button,a{display:inline-block;margin:20px;padding:10px}</style></head>
<body>
<ul><li><a class="share-btn" role="button" tabindex="0">Tweet</a></li></ul><p id="text">Plain article text, not a control.</p>

</script>
</body></html>
